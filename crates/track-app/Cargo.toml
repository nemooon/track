[package]
name = "track-app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "track-gpui"
path = "src/main.rs"

[dependencies]
track-core.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "runtime_shaders"] }
gpui-component = "=0.9.1"
gpui-kit-assets = "=0.9.1"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-channel = "2"
dirs.workspace = true

# Registers the Japanese 「ウインドウ」「ヘルプ」 menus with macOS (GPUI only does it for "Window").
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
