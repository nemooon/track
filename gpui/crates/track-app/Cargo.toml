[package]
name = "track-app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "track-gpui"
path = "src/main.rs"

[dependencies]
track-core.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "runtime_shaders"] }
gpui-component = "=0.9.1"
gpui-kit-assets = "=0.9.1"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-channel = "2"
dirs.workspace = true

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
