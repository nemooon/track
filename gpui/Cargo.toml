[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo run` from gpui/ starts the app; use --workspace for tests
default-members = ["crates/track-app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "6"
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
track-core = { path = "crates/track-core" }

[profile.dev.package."*"]
opt-level = 2
